version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: rice-oil-postgres
    environment:
      POSTGRES_DB: rice_oil
      POSTGRES_USER: riceoil
      POSTGRES_PASSWORD: riceoil
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riceoil -d rice_oil"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["app"]
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rice_oil
      DB_USERNAME: riceoil
      DB_PASSWORD: riceoil
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      APP_FRONTEND_BASE_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-change-me-please-local-dev-secret}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-change-me-admin-password}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "8080:8080"

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
