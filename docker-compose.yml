version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: rice-oil-postgres
    environment:
      POSTGRES_DB: rice_oil
      POSTGRES_USER: riceoil
      POSTGRES_PASSWORD: riceoil
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riceoil -d rice_oil"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
