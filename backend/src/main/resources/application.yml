spring:
  application:
    name: rice-oil-platform-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rice_oil}
    username: ${DB_USERNAME:riceoil}
    password: ${DB_PASSWORD:riceoil}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

app:
  security:
    admin:
      username: ${APP_ADMIN_USERNAME:admin}
      password: ${APP_ADMIN_PASSWORD:change-me-admin-password}
    default:
      username: ${APP_DEFAULT_USERNAME:user}
      password: ${APP_DEFAULT_PASSWORD:change-me-user-password}
    jwt:
      issuer: farmora
      secret: ${JWT_SECRET:change-me-please-local-dev-secret}
      ttl-minutes: ${JWT_TTL_MINUTES:120}
  payments:
    razorpay:
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

logging:
  pattern:
    level: "%5p [corr:%X{correlationId}]"
